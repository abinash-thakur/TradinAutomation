services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    networks:
      - trading-network

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE: ${VITE_API_BASE:-}

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - trading-network

    restart: unless-stopped


networks:
  trading-network:
    external: true