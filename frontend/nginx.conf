server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path falls back to index.html so a refresh on a client-side
    # route doesn't 404. This app doesn't use a router today, but it's a no-op harmless default.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite - safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
