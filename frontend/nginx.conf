server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything the browser talks to goes through this one origin. /api and /socket.io are
    # proxied straight through to the backend container by Docker Compose's internal DNS
    # ("backend" resolves to the backend service) - the browser never sees a cross-origin
    # request, so CORS is a non-issue for this path. The backend's CORS_ORIGIN handling still
    # matters only if something talks to the backend directly, bypassing this proxy.

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO needs the HTTP/1.1 Upgrade handshake kept intact for the websocket transport;
    # it also long-polls as a fallback, which this same block serves fine as plain HTTP.
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s; # keep long-lived websocket connections open
    }

    # Single-page app: any unknown path falls back to index.html so a refresh on a client-side
    # route doesn't 404. This app doesn't use a router today, but it's a no-op harmless default.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite - safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
